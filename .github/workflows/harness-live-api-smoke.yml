name: Harness live API smoke test
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.run_attempt == 1 && (
        (github.event_name == 'workflow_dispatch' &&
         github.ref_name == github.event.repository.default_branch) ||
        (github.event_name == 'pull_request' && github.event.number == 12 &&
         github.event.label.name == 'h4-live-api-smoke' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'work/harness-h0-h1-foundation-20261119')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare a review using the public vanilla asset counts
        run: |
          database="$RUNNER_TEMP/h4-smoke.sqlite"
          python -m mcfr.research_db --db "$database" init
          python -m mcfr.research_db --db "$database" import-legacy
          python -m mcfr.research_db --db "$database" run-create h4-smoke minecraft-java-1.21.11-git --mode REVALIDATE
          python -m mcfr.workflow --db "$database" scan h4-smoke vanilla-smoke --source "$PWD" \
            > "$RUNNER_TEMP/h4-scan.json"
          execution=$(jq -er 'select(.status == "PASS" and .total == 4768) | .execution_id' "$RUNNER_TEMP/h4-scan.json")
          python -m mcfr.workflow --db "$database" review-prepare h4-live-smoke "$execution" \
            --model gpt-5.4-mini --max-output-tokens 96 > "$RUNNER_TEMP/h4-prepared.json"
          jq -e '.request | .store == false and .max_output_tokens == 96 and
            (.input | fromjson | .verified_assets == 4768 and .observations == [])' "$RUNNER_TEMP/h4-prepared.json" > /dev/null
      - name: Send one approved request and verify the response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::The OPENAI_API_KEY Actions secret is unavailable."
            exit 1
          fi
          database="$RUNNER_TEMP/h4-smoke.sqlite"
          approval=$(jq -er '.approval_sha256' "$RUNNER_TEMP/h4-prepared.json")
          code=0
          python -m mcfr.workflow --db "$database" review-send h4-live-smoke --approve "$approval" \
            > "$RUNNER_TEMP/h4-result.json" || code=$?
          jq '{state, result: (.result | {provider_status, provider_http_status, evidence_class, usage, error_type})}' \
            "$RUNNER_TEMP/h4-result.json"
          if (( code != 0 )); then
            exit "$code"
          fi
          jq -e '.state == "COMPLETE" and (.result | .provider_status == "completed" and
            .evidence_class == "AI_INFERENCE" and (.provider_response_id | length > 0) and
            (.text | length > 0) and .usage.input_tokens > 0 and
            .usage.output_tokens > 0 and .usage.output_tokens <= 96)' "$RUNNER_TEMP/h4-result.json" > /dev/null
