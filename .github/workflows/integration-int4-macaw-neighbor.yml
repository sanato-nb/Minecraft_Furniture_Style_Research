name: INT-4 Macaw table real neighbor-placement state transitions
on:
  pull_request:
    paths:
      - 'src/mcfr/int4_macaw_neighbor_capture.py'
      - 'src/mcfr/runtime.py'
      - 'src/mcfr/int4_nonchair_runtime.py'
      - 'tests/knowledge/test_int4_nonchair_runtime.py'
      - '.github/workflows/integration-int4-nonchair-runtime.yml'
      - 'tests/knowledge/test_int4_macaw_neighbor_capture.py'
      - '.github/workflows/integration-int4-macaw-neighbor.yml'
      - 'project/integration/INT4_MACAW_NEIGHBOR_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-fabric-neighbor-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual software renderer, X11 and source-audit dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y \
              xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          fi
      - name: Regress non-assumptive table states and existing Fabric fixtures
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_int4_macaw_neighbor_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_macaw_table_shelf_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_chair_runtime_fixture.py' -v
      - name: Create disposable original Minecraft 1.21.11 world with official dedicated server
        env:
          PYTHONPATH: src
          WORLD: ${{ runner.temp }}/int4-macaw-neighbor-world
          CACHE: ${{ runner.temp }}/int4-macaw-neighbor-world-cache
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.11 --path "$WORLD" --cache "$CACHE"
      - name: Actually add and remove neighboring Macaw 3.4.2 tables in Fabric 1.21.11
        env:
          PYTHONPATH: src
          WORLD: ${{ runner.temp }}/int4-macaw-neighbor-world
          WORK: ${{ runner.temp }}/int4-macaw-neighbor-client
          OUT: ${{ runner.temp }}/int4-macaw-neighbor-evidence
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime macaw-neighbor-capture \
              --version 1.21.11 --world "$WORLD" --work "$WORK" --output "$OUT"
      - name: Independently audit actual server logs for table state transition and F2 SHA
        env:
          PYTHONPATH: src
          OUT: ${{ runner.temp }}/int4-macaw-neighbor-evidence
        run: |
          python -m mcfr.int4_macaw_neighbor_capture --directory "$OUT"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image
          from mcfr.int4_macaw_neighbor_capture import summarize
          folder=Path(os.environ["OUT"])
          x=json.loads((folder/"INT4_MACAW_TABLE_NEIGHBOR_AUDIT.json").read_text())
          assert x["status"]=="REAL_GAME_SERVER_TRANSITIONS_REPRODUCED_NOT_ITEM_PLACEMENT"
          assert x["scope"]["server_neighbor_updates_observed"] is True
          assert x["scope"]["player_manual_item_placement_verified"] is False
          assert x["scope"]["int4_all_complete"] is False
          assert x["scope"]["int5_semantic_approvals"]==0
          assert x["scope"]["int6_rights_approvals"]==0
          assert x["real_F2_count"]==3
          assert x["neighbor_transition_observation"]==summarize(x["observed_server_states"])
          for name,sha in x["per_F2_sha256"].items():
              p=folder/(name+".png")
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
              with Image.open(p) as im:assert im.size==(1024,684)
          lock=Path("project/integration/INT4_MACAW_NEIGHBOR_SOURCE_RESULT.json")
          if lock.exists():
              first=json.loads(lock.read_text())
              assert first["status"]=="REAL_FABRIC_TABLE_NEIGHBOR_BIDIRECTIONAL_JOIN_AND_AUTO_DISCONNECT_VERIFIED"
              assert first["original_mod_jar_sha256"]==x["macaw_jar_sha256"]
              assert first["pinned_research_application_csv_sha256"]==x["source_state_sha256"]
              assert first["actual_integrated_server_observations"]==x["observed_server_states"]
              assert first["derived"]==x["neighbor_transition_observation"]
              assert first["scope"]["int5_semantic_approvals"]==x["scope"]["int5_semantic_approvals"]==0
              assert first["scope"]["int6_ai_rights_approvals"]==x["scope"]["int6_rights_approvals"]==0
              assert first["scope"]["direct_player_item_use_and_mouse_placement_tested"] is False
          print("INT4_MACAW_TABLE_REAL_NEIGHBOR_TRANSITION_SERVER_READBACK_PASS")
          print("RESULT="+json.dumps(x["neighbor_transition_observation"],sort_keys=True))
          PY
      - name: Expiring real Fabric F2 and integrated server logs, no mod original bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-macaw-table-neighbor-native-f2-and-server-states
          path: ${{ runner.temp }}/int4-macaw-neighbor-evidence/
          if-no-files-found: warn
          retention-days: 45
  representative-furniture-and-adjacency:
    uses: ./.github/workflows/integration-int4-nonchair-runtime.yml
