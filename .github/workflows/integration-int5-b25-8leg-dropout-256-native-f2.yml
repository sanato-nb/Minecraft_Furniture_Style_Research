name: INT-5 B25 8 original leg dropout 256 real Fabric F2 source5 context batch
on:
  push:
    branches: [work/int5-b25-eight-leg-dropout-context-source5-batch-f2-20261126]
    paths:
      - src/mcfr/int5_b25_leg_dropout_source5_batch_f2.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_b25_leg_dropout_source5_batch_f2.py
      - .github/workflows/integration-int5-b25-8leg-dropout-256-native-f2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-dropout-source5-original-on-off-32-f2-per-job:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        original_target: [AF121_5, AF123_5]
        context: [without_leg0, without_leg1, without_leg2, without_leg3]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact original Fabric GUI and immutable image audit requirements
        timeout-minutes: 10
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Check each original leave-one-leg-out source5 on-off context geometry UV and negative cases
        run: |
          python -m unittest discover -s tests/knowledge -p test_int5_b23_multigroup_source5_context_f2.py -v
          python -m unittest discover -s tests/knowledge -p test_chair_camera_command_recovery.py -v
          python -m mcfr.runtime --help >/dev/null
          python -m mcfr.runtime int5-b25-leg-dropout-source5-f2 --help > "$RUNNER_TEMP/b25-cli-help.txt"
          for opt in --target --context --version --work --world --output; do
            grep -F -- "$opt" "$RUNNER_TEMP/b25-cli-help.txt"
          done
      - name: Generate pinned official Minecraft Java 1.21.1 creative source world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b25-source-world" \
            --cache "$RUNNER_TEMP/int5-b25-minecraft-cache"
      - name: Run two independent original AF Fabric clients per group and capture 32 real native F2
        timeout-minutes: 85
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b25-leg-dropout-source5-f2 \
              --target "${{ matrix.original_target }}" \
              --context "${{ matrix.context }}" \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b25-source-world" \
              --work "$RUNNER_TEMP/int5-b25-client" \
              --output "$RUNNER_TEMP/int5-b25-${{ matrix.original_target }}-${{ matrix.context }}-isolation"
      - name: Independently audit 32 original F2 and one omitted original source0-3
        env:
          B25_TARGET: ${{ matrix.original_target }}
          B25_CONTEXT: ${{ matrix.context }}
        run: |
          python -m mcfr.int5_b25_leg_dropout_source5_batch_f2 \
            --target "$B25_TARGET" --context "$B25_CONTEXT" \
            --directory "$RUNNER_TEMP/int5-b25-$B25_TARGET-$B25_CONTEXT-isolation"
          python - <<'PY'
          import os,json,pathlib
          target=os.environ["B25_TARGET"]
          context=os.environ["B25_CONTEXT"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/(
              "int5-b25-"+target+"-"+context+"-isolation")
          report=json.loads((root/"INT5_B25_FOUR_ORIGINAL_LEG_OMISSIONS_SOURCE5_INDEPENDENT_F2_AUDIT_V1.json").read_text())
          inherited=report["original_B23_strict_controls_and_source_audit"]
          assert report["target"]==target and report["context"]==context
          assert report["excluded_original_leg_index"]==int(context[-1])
          assert (set(report["retained_original_parent_indices_with_source5"])-
                  set(report["retained_original_parent_indices_without_source5"]))=={5}
          assert report["real_game_clients"]==2 and report["actual_native_F2_SHA256_verified"]==32
          assert report["original_client_logs_SHA256_verified"]==2
          assert report["original_server_chair_state_proofs"]==32
          assert report["original_server_support_slab_state_proofs"]==(32 if target=="AF123_5" else 0)
          assert inherited["status"].startswith("PASS_")
          assert len(inherited["original_real_F2_SHA256"])==2
          assert all(len(x)==16 for x in inherited["original_real_F2_SHA256"].values())
          assert len(inherited["real_client_log_SHA256"])==2
          assert report["exclusive_single_original_leg_occlusion_cause_proven"] is False
          assert report["physical_leg_or_seat_role_proven"] is False
          assert report["original_face_UV_GPU_pixel_owner_verified"] is False
          assert report["material_style_verified"] is False
          assert report["third_party_training_or_redistribution_rights_approved"] is False
          assert report["B19_original_43_of_45_source_removal_visible_still_unchanged"] is True
          assert report["H03"]=="HOLD" and report["H05"]=="CONDITIONAL"
          assert report["F70_unconditional_approved"]==0
          print("B25_ORIGINAL_ONE_LEG_DROPOUT",
                target,context,report["pixels_south_north_east_west"],report["decision"])
          PY
      - name: Preserve native F2, server proof and SHA audit only, not any source or modified mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b25-${{ matrix.original_target }}-${{ matrix.context }}-real32-f2
          retention-days: 45
          path: ${{ runner.temp }}/int5-b25-${{ matrix.original_target }}-${{ matrix.context }}-isolation/
          if-no-files-found: warn
