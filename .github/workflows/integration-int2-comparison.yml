name: INT-2 independent 1-5 model comparison and limitation audit
on:
  pull_request:
    paths:
      - 'scripts/integration/audit_int2_comparison.py'
      - 'tests/integration/test_int2_comparison.py'
      - 'project/integration/INT2_1_5*'
      - '.github/workflows/integration-int2-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared test image dependency
        run: python -m pip install "Pillow>=10.0,<13.0"
      - name: Independent comparison and prior audit regressions
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Download pinned sources without checking them into Git
        env:
          WORK: ${{ runner.temp }}/int2-comparison-upstream
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://codeload.github.com/crispytwig/AnotherFurniture/zip/57eb624cbb7f408d43398c7434b0d38d312cb55d" \
            -o "$WORK/af.zip"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035" \
            -o "$WORK/hc.zip"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://cdn.modrinth.com/data/dtWC90iB/versions/xhmciaUD/mcw-furniture-3.4.2-mc1.21.11fabric.jar" \
            -o "$WORK/macaw.jar"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://piston-data.mojang.com/v1/objects/30c73b1c5da787909b2f73340419fdf13b9def88/client.jar" \
            -o "$WORK/1.21.1.jar"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://piston-data.mojang.com/v1/objects/ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd/client.jar" \
            -o "$WORK/1.21.11.jar"
      - name: Independently verify 74 source model options and recalculate all 21 comparisons
        env:
          WORK: ${{ runner.temp }}/int2-comparison-upstream
          OUT: ${{ runner.temp }}/int2-comparison-results
        run: |
          python scripts/integration/audit_int2_comparison.py \
            --root . --af "$WORK/af.zip" --hc "$WORK/hc.zip" \
            --macaw "$WORK/macaw.jar" --mc1211 "$WORK/1.21.1.jar" \
            --mc12111 "$WORK/1.21.11.jar" --out "$OUT"
      - name: Verify saved 21 finding rows, SHA and scope gates against fresh source audit
        env:
          OUT: ${{ runner.temp }}/int2-comparison-results
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          generated=Path(os.environ["OUT"])
          preserved=Path("project/integration")
          name="INT2_1_5_21_FINDING_CHECKS.csv"
          actual=(generated/name).read_bytes()
          if actual!=(preserved/name).read_bytes():
              raise SystemExit("INT-2 1-5 source finding rows diverged from saved 21 rows")
          old=json.loads((preserved/"INT2_1_5_SUMMARY.json").read_text(encoding="utf-8"))
          new=json.loads((generated/"INT2_1_5_SUMMARY.json").read_text(encoding="utf-8"))
          for key,value in new.items():
              if old.get(key)!=value:
                  raise SystemExit("INT-2 1-5 summary scope/metric changed: "+key)
          if hashlib.sha256(actual).hexdigest()!=old["finding_csv_sha256"]:
              raise SystemExit("INT-2 1-5 SHA-256 is not reproducible")
          with (generated/name).open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          if len(rows)!=21 or any(r["status"]!="PASS" or
                 r["measurements_verified"]!="YES" or
                 r["limitations_preserved"]!="YES" or
                 r["model_source_verified"]!="YES" for r in rows):
              raise SystemExit("INT-2 1-5 finding gate must pass all 21 rows")
          if old["observed"]["handoff_dispositions"]!={"SCOPE_LIMIT_ONLY":7,"CANDIDATE_REQUIRES_REVIEW":14}:
              raise SystemExit("INT-2 1-5 exception/candidate partition changed")
          if old["observed"]["runtime_checks_reexecuted_in_this_audit"]!=0:
              raise SystemExit("Runtime evidence must not be marked independently reexecuted")
          print("INT2_1_5_ALL_21_SOURCED_FINDINGS_AND_HANDOFF_SNAPSHOTS_MATCHED")
          PY
      - name: Upload evidence, never uploaded original texture or mod assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2-1-5-sourced-comparison
          path: ${{ runner.temp }}/int2-comparison-results/
          if-no-files-found: warn
          retention-days: 60
