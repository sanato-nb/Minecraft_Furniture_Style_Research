name: INT-5 independent furniture part geometry and semantic claim triage

on:
  push:
    branches:
      - work/int5-a-chair-part-geometry-semantic-audit-20261125
    paths:
      - src/mcfr/int5_semantic_source_triage.py
      - tests/knowledge/test_int5_semantic_source_triage.py
      - project/integration/INT5_A_45_ELEMENT_GEOMETRY_ROLE_REVIEW_V1.csv
      - project/integration/INT5_A_94_SAMPLE_ROLE_PROVENANCE_V1.csv
      - project/integration/INT5_A_21_FINDING_SCOPE_REVIEW_V1.csv
      - project/integration/INT5_A_EVIDENCE_TRIAGE_SUMMARY_V1.json
      - project/integration/INT5_A_RESEARCH_REPORT_V1.md
      - .github/workflows/integration-int5-semantic-source-triage.yml
  pull_request:
    paths:
      - src/mcfr/int5_semantic_source_triage.py
      - tests/knowledge/test_int5_semantic_source_triage.py
      - project/integration/INT5_A_45_ELEMENT_GEOMETRY_ROLE_REVIEW_V1.csv
      - project/integration/INT5_A_94_SAMPLE_ROLE_PROVENANCE_V1.csv
      - project/integration/INT5_A_21_FINDING_SCOPE_REVIEW_V1.csv
      - project/integration/INT5_A_EVIDENCE_TRIAGE_SUMMARY_V1.json
      - project/integration/INT5_A_RESEARCH_REPORT_V1.md
      - .github/workflows/integration-int5-semantic-source-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-45-94-21-source-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reopen original 1-3-C gzip and 1-3-F xz DB and enumerate original 45/94/21 claims
        run: |
          python -m mcfr.int5_semantic_source_triage \
            --root . --out "$RUNNER_TEMP" --emit-json
      - name: Independently test original counts and prevent mistaken functional approvals
        run: |
          python -m unittest discover \
            -s tests/knowledge -p test_int5_semantic_source_triage.py -v
      - name: Validate exact derived summaries without promoting visual hypotheses
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"]) / \
              "project/integration/INT5_A_EVIDENCE_TRIAGE_SUMMARY_V1.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          c=r["counts"]
          assert c["original_geometry_elements_reopened"]==1911
          assert c["chair_source_role_candidates_measured"]==45
          assert c["sample_specific_claims_reopened"]==94
          assert c["comparison_findings_reopened"]==21
          assert c["comparison_candidates"]==14
          assert c["non_generalizable_limits"]==7
          assert c["pending_semantic_review_queue"]==59
          assert c["independent_new_role_visual_approvals"]==0
          assert c["new_verified_material_or_style_claims"]==0
          assert c["INT6_training_rights_approvals"]==0
          assert r["original_INT4_strict_H03_H05"]=={"H03":"HOLD","H05":"CONDITIONAL"}
          print("INT5_A_45_94_21_INDEPENDENT_SOURCE_ONLY_NO_FALSE_SEMANTIC_PASS")
          PY
      - name: Check permanent GitHub derived outputs if committed
        run: |
          if [ -e project/integration/INT5_A_EVIDENCE_TRIAGE_SUMMARY_V1.json ]; then
            python -m mcfr.int5_semantic_source_triage --verify
          else
            echo "FIRST_RUN_OUTPUTS_ARE_IN_ACTIONS_ARTIFACT_AND_LOG_FOR_PERSISTENCE"
          fi
      - name: Store derived research audit CSV and summary without source artwork
        uses: actions/upload-artifact@v4
        with:
          name: int5-a-45-role-94-sample-21-finding-audit
          path: |
            ${{ runner.temp }}/project/integration/INT5_A_45_ELEMENT_GEOMETRY_ROLE_REVIEW_V1.csv
            ${{ runner.temp }}/project/integration/INT5_A_94_SAMPLE_ROLE_PROVENANCE_V1.csv
            ${{ runner.temp }}/project/integration/INT5_A_21_FINDING_SCOPE_REVIEW_V1.csv
            ${{ runner.temp }}/project/integration/INT5_A_EVIDENCE_TRIAGE_SUMMARY_V1.json
          if-no-files-found: error
          retention-days: 45
