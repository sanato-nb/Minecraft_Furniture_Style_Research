name: INT-4-F11C 바닐라 가마솥·물·랜턴·화분 4건 독립 원본 F2 재감사

on:
  push:
    branches:
      - work/int4-f11c-vanilla-cauldron-lantern-pot-f2-20261123
    paths:
      - scripts/integration/build_int4_f11c_four_vanilla_original_f2_audit.py
      - tests/integration/test_int4_f11c_four_vanilla_original_f2_audit.py
      - .github/workflows/integration-int4-f11c-70-source-audit.yml

permissions:
  actions: read
  contents: write

jobs:
  five-native-vanilla-original-independent:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG decoder and preflight independent audit Python
        run: |
          python3 -m pip install --break-system-packages 'Pillow>=10,<13'
          python3 -m compileall -q scripts/integration/build_int4_f11c_four_vanilla_original_f2_audit.py
          python3 -m unittest discover -s tests/integration \
            -p 'test_int4_f11c_four_vanilla_original_f2_audit.py' -v
      - name: Re-download actual Minecraft source artifact and independently reopen four PNG and client log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/integration/build_int4_f11c_four_vanilla_original_f2_audit.py \
            --artifact-dir "$RUNNER_TEMP/int4-f11c-original-native-artifact"
      - name: Deterministic second original-ZIP recomputation of exactly 70 row ledger
        run: |
          python3 scripts/integration/build_int4_f11c_four_vanilla_original_f2_audit.py \
            --artifact-dir "$RUNNER_TEMP/int4-f11c-original-native-artifact" --verify
      - name: Assert original 70 unchanged except V12-V15, conditional 67 and HOLD 3
        run: |
          python3 - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          root=Path('project/integration')
          j=json.loads((root/'INT4_F11C_FOUR_VANILLA_ORIGINAL_F2_INDEPENDENT_AUDIT_V1.json').read_text(encoding='utf-8'))
          assert j['status']=='PASS_FOUR_MOJANG_12111_NATIVE_F2_CONDITIONAL_67_HOLD_3_FINAL_ZERO'
          c=j['counts']
          assert (c['fixed_F_target_count'],c['historical_1_5_cases'])==(70,62)
          assert (c['new_real_game_exact_states'],c['new_original_native_F2'])==(4,4)
          assert (c['new_original_selected_model_applications'],c['new_original_elements'],c['new_original_faces'])==(4,36,154)
          assert (c['F_conditional_before'],c['F_conditional_after'])==(63,67)
          assert (c['F_HOLD_before'],c['F_HOLD_after'])==(7,3)
          assert (c['historical_F2_conditional_before'],c['historical_F2_conditional_after'])==(57,61)
          assert c['F_unconditionally_accepted']==c['new_INT5_semantic_part_approvals']==c['new_INT6_training_redistribution_rights_approvals']==0
          assert set(j['cases'])=={'V12','V13','V14','V15'}
          assert set(j['remaining_HOLD_ids'])=={'V11','R06','R08'}
          assert j['cases']['V13']['water_vs_empty_original_F2_delta_pixels']>=800
          for name,key,n in (
            ('INT4_F11C_70_TARGET_EVIDENCE_DISPOSITIONS_V12.csv','F70',70),
            ('INT4_F11C_3_PENDING_EXACT_F2_TARGETS_V1.csv','pending',3),
          ):
            raw=(root/name).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==j['output_SHA256'][key]
            with (root/name).open(encoding='utf-8',newline='') as f:
              assert len(list(csv.DictReader(f)))==n
          print('PASS F11C conditional67 HOLD3 fullF0; research source SHA and original native four F2 unchanged')
          PY
          git diff --check
      - name: Preserve derived audit text only, original Minecraft PNG/JAR excluded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-f11c-70-67-conditional-3-hold-vanilla-source-audit
          retention-days: 45
          path: |
            project/integration/INT4_F11C_70_TARGET_EVIDENCE_DISPOSITIONS_V12.csv
            project/integration/INT4_F11C_3_PENDING_EXACT_F2_TARGETS_V1.csv
            project/integration/INT4_F11C_FOUR_VANILLA_ORIGINAL_F2_INDEPENDENT_AUDIT_V1.json
            project/integration/INT4_F11C_FOUR_CASE_ORIGINAL_IMAGE_REVIEW_V1.md
          if-no-files-found: warn
      - name: Update only Draft F11C evidence branch and never merge main
        if: success() && github.ref == 'refs/heads/work/int4-f11c-vanilla-cauldron-lantern-pot-f2-20261123'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/integration/INT4_F11C_70_TARGET_EVIDENCE_DISPOSITIONS_V12.csv \
                  project/integration/INT4_F11C_3_PENDING_EXACT_F2_TARGETS_V1.csv \
                  project/integration/INT4_F11C_FOUR_VANILLA_ORIGINAL_F2_INDEPENDENT_AUDIT_V1.json \
                  project/integration/INT4_F11C_FOUR_CASE_ORIGINAL_IMAGE_REVIEW_V1.md
          if ! git diff --cached --quiet; then
            git commit -m "INT-4-F11C 바닐라 4건 F2 독립검증 조건부67·보류3 최신 원장 반영"
            git fetch origin refs/heads/work/int4-f11c-vanilla-cauldron-lantern-pot-f2-20261123
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/work/int4-f11c-vanilla-cauldron-lantern-pot-f2-20261123
          fi
