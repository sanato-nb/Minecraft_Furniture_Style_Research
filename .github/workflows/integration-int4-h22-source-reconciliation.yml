name: INT-4 H22 HC Macaw 12 original source and F2 reconciliation
on:
  push:
    branches: [work/int4-h22-hc-macaw12-original-source-20261124]
    paths:
      - src/mcfr/int4_h22*
      - tests/knowledge/test_int4_h22*
      - project/integration/INT4_H22*
      - project/integration/INT4_F70_MODELING_CONTRACT_*_V4.*
      - .github/workflows/integration-int4-h22-source-reconciliation.yml
  pull_request:
    paths:
      - src/mcfr/int4_h22*
      - tests/knowledge/test_int4_h22*
      - project/integration/INT4_H22*
      - project/integration/INT4_F70_MODELING_CONTRACT_*_V4.*
      - .github/workflows/integration-int4-h22-source-reconciliation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PNG decoder and regression controls
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests/knowledge -p 'test_int4_h22*' -v
      - name: Retrieve pinned original Git, release JARs and vanilla parents
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 120 https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035 -o "$RUNNER_TEMP/h22-hc.zip"
          curl -fLsS --retry 3 --max-time 120 https://cdn.modrinth.com/data/pJmCFF0p/versions/f0pKpUWd/handcrafted-fabric-1.21.1-4.0.3.jar -o "$RUNNER_TEMP/h22-hc.jar"
          curl -fLsS --retry 3 --max-time 120 https://cdn.modrinth.com/data/dtWC90iB/versions/xhmciaUD/mcw-furniture-3.4.2-mc1.21.11fabric.jar -o "$RUNNER_TEMP/h22-macaw.jar"
          curl -fLsS --retry 3 --max-time 120 https://piston-data.mojang.com/v1/objects/30c73b1c5da787909b2f73340419fdf13b9def88/client.jar -o "$RUNNER_TEMP/h22-mc1211.jar"
          curl -fLsS --retry 3 --max-time 120 https://piston-data.mojang.com/v1/objects/ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd/client.jar -o "$RUNNER_TEMP/h22-mc12111.jar"
      - name: Reopen all twelve source models and reconcile existing F2 identity
        run: |
          python -m mcfr.int4_h22_hc_macaw12_original_source --hc-git "$RUNNER_TEMP/h22-hc.zip" --hc-jar "$RUNNER_TEMP/h22-hc.jar" --macaw-jar "$RUNNER_TEMP/h22-macaw.jar" --mc1211 "$RUNNER_TEMP/h22-mc1211.jar" --mc12111 "$RUNNER_TEMP/h22-mc12111.jar" --output "$RUNNER_TEMP/h22-derived/INT4_H22_HC_MACAW12_SOURCE_RESULT_V1.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"h22-derived/INT4_H22_HC_MACAW12_SOURCE_RESULT_V1.json"
          d=json.loads(p.read_text())
          assert d["case_count"]==d["applications"]==12
          assert d["new_game_runs"]==d["new_F2"]==d["legacy_F70_unconditional"]==0
          assert not d["R06_temporal_causality_approved"]
          old=Path("project/integration/INT4_H22_HC_MACAW12_SOURCE_RESULT_V1.json")
          if old.exists():assert json.loads(old.read_text())==d
          print("H22_JSON_BEGIN")
          print(json.dumps(d,sort_keys=True,separators=(",",":")))
          print("H22_JSON_END")
          PY
      - name: Independently verify V4 promotion and preserve R06 and legacy gates
        run: python -m mcfr.int4_h22_modeling_delta
      - name: Preserve derived metadata only
        uses: actions/upload-artifact@v4
        with:
          name: int4-h22-derived-source
          retention-days: 45
          path: ${{ runner.temp }}/h22-derived
          if-no-files-found: error
