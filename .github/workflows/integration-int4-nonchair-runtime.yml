name: INT-4 representative furniture and adjacency Fabric F2
on:
  pull_request:
    paths:
      - 'src/mcfr/int4_nonchair_runtime.py'
      - 'src/mcfr/runtime.py'
      - 'tests/knowledge/test_int4_nonchair_runtime.py'
      - '.github/workflows/integration-int4-nonchair-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.11']
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PYTHONPATH: src
      MC: ${{ matrix.minecraft }}
      WORLD: ${{ runner.temp }}/int4-world
      CACHE: ${{ runner.temp }}/int4-cache
      WORK: ${{ runner.temp }}/int4-client
      OUT: ${{ runner.temp }}/int4-evidence
      MCFR_HC_SOURCE_ZIP: ${{ runner.temp }}/int4-hc-source.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software renderer and audit dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          fi
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_int4_nonchair_runtime.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_chair_runtime_fixture.py' -v
      - name: Fetch pinned Handcrafted Git source
        if: matrix.minecraft == '1.21.1'
        run: |
          curl -fLsS --retry 3 --max-time 90 \
            'https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035' \
            -o "$MCFR_HC_SOURCE_ZIP"
      - name: Generate disposable official Minecraft world
        run: python -m mcfr.chair_runtime_fixture world --version "$MC" --path "$WORLD" --cache "$CACHE"
      - name: Capture native F2 and integrated server states
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int4-nonchair-capture --version "$MC" \
            --world "$WORLD" --work "$WORK" --output "$OUT"
      - name: Reparse server log and verify original screenshot hashes
        run: python -m mcfr.int4_nonchair_runtime --directory "$OUT"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-fabric-nonchair-${{ matrix.minecraft }}
          path: ${{ env.OUT }}/
          retention-days: 45
          if-no-files-found: warn
