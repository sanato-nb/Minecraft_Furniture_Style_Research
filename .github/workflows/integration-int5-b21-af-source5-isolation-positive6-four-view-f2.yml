name: INT-5 B21 AF source5 isolation with source6 positive four real Fabric clients
on:
  push:
    branches: [work/int5-b21-af-source5-isolation-positive6-four-view-f2-20261126]
    paths:
      - src/mcfr/int5_b21_af_source5_isolation_four_view_f2.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_b21_af_source5_isolation_four_view_f2.py
      - .github/workflows/integration-int5-b21-af-source5-isolation-positive6-four-view-f2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-flattened-and-reversed-X-corrected-independent-f2:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        original_target: [AF121_5, AF123_5]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact original Fabric GUI and immutable image audit requirements
        timeout-minutes: 10
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Check original source5 isolation, zero-face and original6 positive controls
        run: |
          python -m unittest discover -s tests/knowledge -p test_int5_b21_af_source5_isolation_four_view_f2.py -v
          python -m unittest discover -s tests/knowledge -p test_chair_camera_command_recovery.py -v
          python -m mcfr.runtime --help >/dev/null
          python -m mcfr.runtime int5-b21-af-source5-isolation-four-view-f2 --help > "$RUNNER_TEMP/b21-cli-help.txt"
          for opt in --target --version --work --world --output; do
            grep -F -- "$opt" "$RUNNER_TEMP/b21-cli-help.txt"
          done
      - name: Generate pinned official Minecraft Java 1.21.1 creative source world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b21-source-world" \
            --cache "$RUNNER_TEMP/int5-b21-minecraft-cache"
      - name: Run 4 independent Fabric clients with all four cameras and 64 real native F2
        timeout-minutes: 85
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b21-af-source5-isolation-four-view-f2 \
              --target "${{ matrix.original_target }}" \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b21-source-world" \
              --work "$RUNNER_TEMP/int5-b21-client" \
              --output "$RUNNER_TEMP/int5-b21-${{ matrix.original_target }}-isolation"
      - name: Independently audit 64 native F2 PNG SHA four real client logs with positive6 visibility
        env:
          B21_TARGET: ${{ matrix.original_target }}
        run: |
          python -m mcfr.int5_b21_af_source5_isolation_four_view_f2 \
            --target "$B21_TARGET" \
            --directory "$RUNNER_TEMP/int5-b21-$B21_TARGET-isolation"
          python - <<'PY'
          import os,json,pathlib
          target=os.environ["B21_TARGET"]
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/("int5-b21-"+target+"-isolation")
          a=json.loads((base/"INT5_B21_SOURCE5_ISOLATION_INDEPENDENT_F2_AUDIT_V1.json").read_text(encoding="utf-8"))
          assert a["target"]==target
          assert a["real_game_sessions"]==4 and a["native_F2_SHA256_verified"]==64
          assert a["client_log_SHA256_verified"]==4
          assert a["real_server_chair_proofs"]==64
          assert a["real_server_support_slab_proofs"]==(64 if target=="AF123_5" else 0)
          assert len(a["actual_client_log_sha256"])==4
          assert all(len(x)==16 for x in a["actual_native_F2_sha256"].values())
          assert set(a["four_camera_isolated_model_metrics"])=={"south","north","east","west"}
          assert a["B19_43_of_45_bounded_render_response_unchanged"] is True
          assert a["source5_function_material_style_approved"] is False
          assert a["source5_exclusive_original_face_UV_GPU_pixel_ownership_approved"] is False
          assert a["third_party_AI_training_and_redistribution_rights_approved"] is False
          assert a["H03"]=="HOLD" and a["H05"]=="CONDITIONAL"
          assert a["F70_unconditional_approved"]==0
          assert not a["result"].startswith("CONDITIONAL_FAILED"),a["result"]
          print("INT5_B21_DECISION",target,a["result"])
          for view,row in a["four_camera_isolated_model_metrics"].items():
            print("INT5_B21_FOUR_VIEW_PIXELS",target,view,
                row["original_5"]["isolation_before_changed_pixels"],
                row["normalized_5"]["isolation_before_changed_pixels"],
                row["positive_6"]["isolation_before_changed_pixels"])
          PY
      - name: Preserve native F2, server proof and SHA audit only, not any source or modified mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b21-${{ matrix.original_target }}-source5-isolation-positive6-f2
          retention-days: 45
          path: ${{ runner.temp }}/int5-b21-${{ matrix.original_target }}-isolation/
          if-no-files-found: warn
