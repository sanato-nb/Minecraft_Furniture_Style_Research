name: INT-4-F2 미확인 4개 가구 상태 실제 Fabric F2 재촬영

on:
  push:
    branches:
      - work/int4-f2-four-missing-case-native-f2-20261122
    paths:
      - src/mcfr/int4_nonchair_runtime.py
      - src/mcfr/int4_f_missing_capture.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int4_f_missing_capture.py
      - .github/workflows/integration-int4-f2-four-real-f2.yml

permissions:
  contents: write

jobs:
  f2-four-pinned-real-client:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install original native GUI renderer and source dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y \
              xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          fi

      - name: Check fixed 4-study source identities and old six-case regression
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_int4_f_missing_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_nonchair_runtime.py' -v

      - name: Fetch original Handcrafted pinned 1.21.1 research Git archive
        run: |
          curl -fLSS --retry 3 --max-time 90 \
            'https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035' \
            -o "$RUNNER_TEMP/int4-f2-hc-original-source.zip"
          echo "MCFR_HC_SOURCE_ZIP=$RUNNER_TEMP/int4-f2-hc-original-source.zip" >> "$GITHUB_ENV"

      - name: Generate disposable official Minecraft 1.21.1 world
        run: |
          echo "WORLD=$RUNNER_TEMP/int4-f2-world" >> "$GITHUB_ENV"
          echo "CACHE=$RUNNER_TEMP/int4-f2-cache" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/int4-f2-work" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/int4-f2-evidence" >> "$GITHUB_ENV"
          python -m mcfr.chair_runtime_fixture world --version 1.21.1 \
            --path "$RUNNER_TEMP/int4-f2-world" --cache "$RUNNER_TEMP/int4-f2-cache"

      - name: Real Fabric client four exact source states and four native F2 images
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int4-f-missing-capture \
              --version 1.21.1 --world "$WORLD" --work "$WORK" --output "$OUT"

      - name: Independently audit original source SHA and four actual game log/screenshot checks
        run: |
          python -m mcfr.int4_f_missing_capture \
            --directory "$OUT" \
            --output project/integration/INT4_F2_NEW4_ACTUAL_CLIENT_SOURCE_SUMMARY_V1.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          from PIL import Image
          p=Path('project/integration/INT4_F2_NEW4_ACTUAL_CLIENT_SOURCE_SUMMARY_V1.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['status']=='PASS_EXACT_FOUR_ORIGINAL_CASE_SERVER_F2_SHA_NOT_SEMANTIC_RENDER_EXIT'
          assert r['minecraft']=='1.21.1'
          assert r['cases']==['S05','S06','S07','S10']
          assert r['native_f2_png_count']==4
          assert r['original_research_case_model_elements']==42
          assert r['original_research_case_model_faces']==248
          assert r['evidence_limits']['human_visual_approval_automated'] is False
          assert r['evidence_limits']['int5_semantic_approvals']==0
          assert r['evidence_limits']['int6_training_redistribution_rights_approved']==0
          for key,row in r['source_files_by_case'].items():
              img=Path(os.environ['OUT'])/(key+'.png')
              assert hashlib.sha256(img.read_bytes()).hexdigest()==row['native_f2_sha256']
              assert row['server_exact_state_readback'] is True
              assert row['original_source_model_selection_equals_release'] is True
              with Image.open(img) as p:
                  assert p.format=='PNG' and p.size==(1024,684)
                  p.load()
              print('PASS exact real game state+native F2',key,row['native_f2_sha256'])
          assert hashlib.sha256((Path(os.environ['OUT'])/'client.log').read_bytes()).hexdigest()==r['client_log_sha256']
          print('Four original image hashes and client state logs pinned')
          PY
          git diff --check

      - name: Archive the first original four real F2 PNGs and source/locale logs (expires)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-f2-missing-four-first-native-f2-source-states
          retention-days: 45
          path: ${{ env.OUT }}/
          if-no-files-found: warn

      - name: Keep only derived metadata in stacked Draft PR branch
        if: success() && github.ref == 'refs/heads/work/int4-f2-four-missing-case-native-f2-20261122'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/integration/INT4_F2_NEW4_ACTUAL_CLIENT_SOURCE_SUMMARY_V1.json
          if git diff --cached --quiet; then
            echo "No new source metadata"
          else
            git commit -m "INT-4-F2 실제 Fabric 4개 미확인 사례 서버 상태·F2 SHA 기록"
            git push origin HEAD:refs/heads/work/int4-f2-four-missing-case-native-f2-20261122
          fi
