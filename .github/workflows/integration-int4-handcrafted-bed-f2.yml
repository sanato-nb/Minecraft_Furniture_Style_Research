name: INT-4 Handcrafted bed foot and head original Git vs actual Fabric F2
on:
  pull_request:
    paths:
      - 'src/mcfr/int4_handcrafted_bed_capture.py'
      - 'src/mcfr/runtime.py'
      - 'tests/knowledge/test_int4_handcrafted_bed_capture.py'
      - '.github/workflows/integration-int4-handcrafted-bed-f2.yml'
      - 'project/integration/INT4_HANDCRAFTED_BED_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-git-release-jar-real-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Minecraft software GUI and original F2 image evidence validators
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y \
              xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          fi
      - name: Regression test original bed cases/fixture and reject synthetic F2 proof
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_int4_handcrafted_bed_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_chair_runtime_fixture.py' -v
      - name: Fetch exact Handcrafted study Git commit for separate source vs installed release proof
        env:
          SOURCE: ${{ runner.temp }}/int4-hc-bed-fixed-source.zip
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --retry-delay 2 \
            'https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035' \
            -o "$SOURCE"
          python - <<'PY'
          import os,zipfile
          with zipfile.ZipFile(os.environ['SOURCE']) as z:
              assert any(x.endswith('/common/src/main/generated/resources/assets/handcrafted/blockstates/oak_fancy_bed.json') for x in z.namelist())
          print('HANDCRAFTED_BED_PINNED_GIT_SOURCE_READY')
          PY
      - name: Create disposable official Mojang Minecraft 1.21.1 flat creative world
        env:
          PYTHONPATH: src
          WORLD: ${{ runner.temp }}/int4-hc-bed-world
          CACHE: ${{ runner.temp }}/int4-hc-bed-world-cache
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 --path "$WORLD" --cache "$CACHE"
      - name: Compare actual Handcrafted release JAR against original Git and capture two source-part states
        env:
          PYTHONPATH: src
          WORLD: ${{ runner.temp }}/int4-hc-bed-world
          WORK: ${{ runner.temp }}/int4-hc-bed-client
          OUT: ${{ runner.temp }}/int4-hc-bed-f2
          MCFR_HC_SOURCE_ZIP: ${{ runner.temp }}/int4-hc-bed-fixed-source.zip
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime hc-bed-capture \
              --version 1.21.1 --work "$WORK" --world "$WORLD" --output "$OUT"
      - name: Audit original actual F2 SHA, on-server two states, source geometry and research scope
        env:
          PYTHONPATH: src
          OUT: ${{ runner.temp }}/int4-hc-bed-f2
        run: |
          python -m mcfr.int4_handcrafted_bed_capture --directory "$OUT"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['OUT'])
          doc=json.loads((root/'INT4_HC_BED_SOURCE_F2_AUDIT.json').read_text())
          lock=json.loads(Path('project/integration/INT4_HANDCRAFTED_BED_F2_SOURCE_RESULT.json').read_text())
          first=lock['first_paired_background_controlled_f2']['observed']
          assert first['source_cases']==doc['source_cases']
          assert first['original_face_counts']==doc['original_face_counts']
          assert first['original_JAR_sha1']==doc['original_JAR_sha1']
          assert first['limitations']==doc['limitations']
          assert set(doc['same_camera_bed_vs_air_changed_pixels'])=={'S37','S38'}
          # Quantitative image pixel counts and PNG hashes need not be identical across runs.
          assert doc['status']=='PASS_TWO_REAL_FABRIC_F2_PINNED_BED_SOURCE_STATES_NOT_NATURAL_ASSEMBLY'
          assert doc['source_cases']==['S37','S38']
          assert doc['original_face_counts']=={'S37':72,'S38':6}
          assert doc['actual_F2_count']==doc['server_verified']==2
          assert set(doc['paired_air_control_f2_sha256'])=={'S37','S38'}
          assert set(doc['same_camera_bed_vs_air_changed_pixels'])=={'S37','S38'}
          assert min(doc['same_camera_bed_vs_air_changed_pixels'].values())>=100
          assert doc['original_JAR_sha1']=='a9579fecd7ed429c282be21d5c921d220197acc6'
          assert not doc['limitations']['natural_bed_two_part_behavior_tested']
          assert doc['limitations']['int5_part_roles_approved']==0
          assert doc['limitations']['int6_rights_approved']==0
          for cid,digest in doc['native_f2_sha256'].items():
              p=root/(cid+'.png')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
              air=root/(cid+'_air_control.png')
              assert hashlib.sha256(air.read_bytes()).hexdigest()==doc['paired_air_control_f2_sha256'][cid]
              with Image.open(p) as im:assert im.size==(1024,684)
              with Image.open(air) as im:assert im.size==(1024,684)
          assert hashlib.sha256((root/'INT4_HC_BED_SOURCE_F2_CAPTURE.json').read_bytes()).hexdigest()==doc['manifest_sha256']
          assert hashlib.sha256((root/'INT4_HC_BED_TWO_F2_CONTACT.png').read_bytes()).hexdigest()==doc['contact_sha256']
          pinned=Path('project/integration/INT4_HANDCRAFTED_BED_F2_SOURCE_RESULT.json')
          if pinned.exists():
              first=json.loads(pinned.read_text())['first_actual_game_audit']
              assert first['source_cases']==doc['source_cases']
              assert first['original_face_counts']==doc['original_face_counts']
              assert first['limitations']==doc['limitations']
          print('INT4_HANDCRAFTED_BED_2_SOURCE_PARTS_2_REAL_F2_PASS')
          print('F2_BY_CASE='+json.dumps(doc['native_f2_sha256'],sort_keys=True))
          PY
      - name: Save only actual source-state F2 images and metadata, not original mod assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-hc-bed-foot-head-actual-fabric-f2
          path: ${{ runner.temp }}/int4-hc-bed-f2/
          retention-days: 45
          if-no-files-found: warn
