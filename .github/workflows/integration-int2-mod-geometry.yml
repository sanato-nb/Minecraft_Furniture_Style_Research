name: INT-2 independent 1-3 furniture source and geometry
on:
  pull_request:
    paths:
      - 'scripts/integration/audit_int2_mod_geometry.py'
      - 'tests/integration/test_int2_mod_geometry.py'
      - 'project/integration/INT2_MOD*'
      - '.github/workflows/integration-int2-mod-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mod-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared PNG test dependency
        run: python -m pip install "Pillow>=10.0,<13.0"
      - name: Validate independent geometry calculations
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Download only pinned original upstream sources into temporary directory
        env:
          WORK: ${{ runner.temp }}/int2-upstream
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://codeload.github.com/crispytwig/AnotherFurniture/zip/57eb624cbb7f408d43398c7434b0d38d312cb55d" \
            -o "$WORK/af.zip"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035" \
            -o "$WORK/hc.zip"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://cdn.modrinth.com/data/dtWC90iB/versions/xhmciaUD/mcw-furniture-3.4.2-mc1.21.11fabric.jar" \
            -o "$WORK/macaw.jar"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://piston-data.mojang.com/v1/objects/30c73b1c5da787909b2f73340419fdf13b9def88/client.jar" \
            -o "$WORK/1.21.1.jar"
          curl -fLSs --retry 3 --retry-delay 2 \
            "https://piston-data.mojang.com/v1/objects/ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd/client.jar" \
            -o "$WORK/1.21.11.jar"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          base=Path(os.environ["WORK"])
          for name,expected in [
            ("macaw.jar","e55d7a78b878043af82875cb8738941b0bba1a3c77652dea3d75a434dbba1a0e"),
            ("1.21.1.jar","30c73b1c5da787909b2f73340419fdf13b9def88"),
            ("1.21.11.jar","ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd"),
          ]:
            obj=(base/name).read_bytes()
            alg="sha256" if name=="macaw.jar" else "sha1"
            if hashlib.new(alg,obj).hexdigest()!=expected:
              raise SystemExit("Official pinned binary mismatch: "+name)
            print("PIN_VERIFIED",name,len(obj))
          PY
      - name: Independently inspect all 16572 model originals, hierarchies and geometry
        env:
          WORK: ${{ runner.temp }}/int2-upstream
          OUT: ${{ runner.temp }}/int2-mod-results
        run: |
          python scripts/integration/audit_int2_mod_geometry.py \
            --root . --af "$WORK/af.zip" --hc "$WORK/hc.zip" \
            --macaw "$WORK/macaw.jar" --mc1211 "$WORK/1.21.1.jar" \
            --mc12111 "$WORK/1.21.11.jar" --out "$OUT"
      - name: Verify pinned Git audit summary and exception evidence against fresh run
        env:
          OUT: ${{ runner.temp }}/int2-mod-results
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          actual=Path(os.environ["OUT"])
          saved=Path("project/integration")
          historic=json.loads((saved/"INT2_MOD_SOURCE_SUMMARY.json").read_text(encoding="utf-8"))
          current=json.loads((actual/"INT2_MOD_SOURCE_SUMMARY.json").read_text(encoding="utf-8"))
          for key,value in current.items():
              if historic.get(key)!=value:
                  raise SystemExit("Committed 1-3 model audit summary differs: "+key)
          with (actual/"INT2_MOD_16572_MODEL_CHECKS.csv").open(encoding="utf-8",newline="") as f:
              checks=list(csv.DictReader(f))
          if len(checks)!=16572 or any(r["status"]!="PASS" for r in checks):
              raise SystemExit("Not all 16,572 per-model independent audit rows passed")
          model_digest=hashlib.sha256((actual/"INT2_MOD_16572_MODEL_CHECKS.csv").read_bytes()).hexdigest()
          if historic["per_model_csv_sha256"]!=model_digest:
              raise SystemExit("Full model evidence SHA-256 differs")
          actual_exceptions=(actual/"INT2_MOD_EXCEPTIONS.csv").read_bytes()
          if actual_exceptions!=(saved/"INT2_MOD_EXCEPTIONS.csv").read_bytes():
              raise SystemExit("Parent/static exception roster differs from pinned report")
          if historic["exception_csv_sha256"]!=hashlib.sha256(actual_exceptions).hexdigest():
              raise SystemExit("Exception evidence SHA-256 differs")
          print("INT2_1_3_PINNED_MODEL_AUDIT_MATCHED_ALL_16572")
          PY
      - name: Upload only model audit evidence; never upload upstream original assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2-1-3-original-model-geometry
          path: ${{ runner.temp }}/int2-mod-results/
          if-no-files-found: warn
          retention-days: 60
