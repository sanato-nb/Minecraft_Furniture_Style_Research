name: INT-4-H10 real HC bed occupied foot false true air same-camera F2

on:
  push:
    branches:
      - work/int4-h10-hc-bed-occupied-real-f2-20261123
    paths:
      - src/mcfr/int4_h10_hc_bed_occupied_f2_capture.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int4_h10_hc_bed_occupied_f2_capture.py
      - .github/workflows/integration-int4-h10-occupied-bed-real-f2.yml

permissions:
  contents: write

jobs:
  model-only-real-game-occupied-state:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Minecraft source and screenshot validation requirements
        timeout-minutes: 8
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          fi
      - name: Run source selectors and actual F2 fail-closed tests
        run: |
          python -m unittest discover -s tests/knowledge \
            -p 'test_int4_h10_hc_bed_occupied_f2_capture.py' -v
          python -m unittest discover -s tests/knowledge \
            -p 'test_int4_handcrafted_bed_capture.py' -v
          python -m unittest discover -s tests/integration \
            -p 'test_int4_h9_hc_bed_occupied_model_delta.py' -v
      - name: Reopen exact upstream Handcrafted 4.0.3 source
        run: |
          curl -fLSs --retry 3 --max-time 120 \
            'https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035' \
            -o "$RUNNER_TEMP/h10-original-hc-source.zip"
          python scripts/integration/build_int4_h9_hc_bed_occupied_model_delta.py \
            --source-zip "$RUNNER_TEMP/h10-original-hc-source.zip" --verify
      - name: Create disposable real Minecraft Java 1.21.1 singleplayer world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 --path "$RUNNER_TEMP/h10-bed-world" \
            --cache "$RUNNER_TEMP/h10-bed-cache"
      - name: Actually run Fabric client and capture one foot occupied false true air F2 with same camera
        env:
          MCFR_HC_SOURCE_ZIP: ${{ runner.temp }}/h10-original-hc-source.zip
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int4-h10-hc-bed-occupied \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/h10-bed-world" \
              --work "$RUNNER_TEMP/h10-bed-client" \
              --output "$RUNNER_TEMP/h10-original-native-f2"
      - name: Independently verify actual client log and three F2 pixel comparisons
        run: |
          python -m mcfr.int4_h10_hc_bed_occupied_f2_capture \
            --directory "$RUNNER_TEMP/h10-original-native-f2"
          cp "$RUNNER_TEMP/h10-original-native-f2/INT4_H10_OCCUPIED_FOOT_REAL_GAME_INDEPENDENT_AUDIT_V1.json" \
            project/integration/INT4_H10_OCCUPIED_FOOT_REAL_CLIENT_SOURCE_AUDIT_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/integration/INT4_H10_OCCUPIED_FOOT_REAL_CLIENT_SOURCE_AUDIT_V1.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS_SOURCE_STATE_AND_SAME_CAMERA_F2_VISUAL_CONTRAST',r['status']
          assert len(r['original_native_F2_sha256'])==3
          assert r['screen_ROI_changed_pixels']['occupied_false_vs_true']>=100
          assert r['screen_ROI_changed_pixels']['occupied_false_vs_air']>=100
          assert r['screen_ROI_changed_pixels']['occupied_true_vs_air']>=100
          assert r['new_gameplay_sleeps_or_breaks']==0
          assert r['full_F70_unconditional_approvals']==0
          assert r['H03_H05_full_exit_approved'] is False
          assert r['face_by_face_texture_UV_pixel_causality_approved'] is False
          assert r['INT5_semantic_approved']==0
          assert r['INT6_AI_training_redistribution_approved']==0
          print('PASS real Fabric occupied=false/true/air at same F2 camera, source-only scope')
          PY
          git diff --check
      - name: Retain real PNGs and client log only in expiring Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-h10-real-hc-bed-occupied-false-true-air-native-f2
          path: ${{ runner.temp }}/h10-original-native-f2/
          if-no-files-found: warn
          retention-days: 45
      - name: Commit only derived metadata into H10 Draft branch
        if: success() && github.ref == 'refs/heads/work/int4-h10-hc-bed-occupied-real-f2-20261123'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/integration/INT4_H10_OCCUPIED_FOOT_REAL_CLIENT_SOURCE_AUDIT_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "INT-4-H10 침대 발 occupied 모델 동일카메라 F2 실제 게임 서버·PNG 감사"
            git push origin HEAD:refs/heads/work/int4-h10-hc-bed-occupied-real-f2-20261123
          fi
