name: INT-2 independent D blockstate enumeration
on:
  pull_request:
    paths:
      - 'scripts/integration/**'
      - 'tests/integration/**'
      - 'project/integration/**'
      - '.github/workflows/integration-int2-states.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    env:
      PYTHONPATH: src
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG test dependency for shared regression suite
        run: python -m pip install "Pillow>=10.0,<13.0"
      - name: Independent state/geometry/PNG regression tests
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Independently enumerate and compare all 1-2-D cases
        run: python scripts/integration/audit_int2_states.py --root . --out "$RUNNER_TEMP/int2-states"
      - name: Verify committed per-source D results against fresh computation
        env:
          INT2_OUTPUT: ${{ runner.temp }}/int2-states
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["INT2_OUTPUT"])
          saved = Path("project/integration")
          name = "INT2_D_1168_SOURCE_CROSSCHECK.csv"
          if (out / name).read_bytes() != (saved / name).read_bytes():
              raise SystemExit("INT-2 D 1168-source CSV snapshot mismatch")
          old = json.loads((saved / "INT2_D_SUMMARY.json").read_text(encoding="utf-8"))
          new = json.loads((out / "INT2_D_SUMMARY.json").read_text(encoding="utf-8"))
          for key, value in new.items():
              if old.get(key) != value:
                  raise SystemExit("INT-2 D summary snapshot mismatch: " + key)
          print("INT2_D_ALL_1168_SOURCE_SNAPSHOTS_MATCHED")
          PY
      - name: Upload state enumeration evidence even on failed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2-d-states-independent-recheck
          path: ${{ runner.temp }}/int2-states/
          if-no-files-found: warn
          retention-days: 60
