name: INT-2 independent D blockstate enumeration
on:
  pull_request:
    paths:
      - 'scripts/integration/**'
      - 'tests/integration/**'
      - 'project/integration/**'
      - '.github/workflows/integration-int2-states.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG test dependency for shared regression suite
        run: python -m pip install "Pillow>=10.0,<13.0"
      - name: Independent state/geometry/PNG regression tests
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Independently enumerate and compare all 1-2-D cases
        run: python scripts/integration/audit_int2_states.py --root . --out "$RUNNER_TEMP/int2-states"
      - name: Upload state enumeration evidence even on failed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2-d-states-independent-recheck
          path: ${{ runner.temp }}/int2-states/
          if-no-files-found: warn
          retention-days: 60
