name: INT-5 B5 AF123 disposable element4 removal original-versus-F2 causal test

on:
  push:
    branches:
      - work/int5-b5-af-element4-ephemeral-removal-f2-20261125
    paths:
      - src/mcfr/int5_af_element4_removal_f2.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_af_element4_removal_f2.py
      - .github/workflows/integration-int5-b5-af-element4-removal-native-f2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-fabric-single-source-element-intervention:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated official Fabric and pixel-decoding dependencies
        timeout-minutes: 8
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Verify source element4 and nine bounded negative-control tests
        run: |
          python -m unittest discover -s tests/knowledge -p test_int5_af_element4_removal_f2.py -v
          python -m unittest discover -s tests/knowledge -p test_int5_af_tucked_slab_control.py -v
      - name: Retrieve the exact original eight-F2 B4 baseline, not a new re-render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/int5-b5-original-b4"
          gh run download 45528207751 \
            --repo sanato-nb/Minecraft_Furniture_Style_Research \
            --name int5-b4-original-fabric-tucked-slab-eight-native-f2 \
            --dir "$RUNNER_TEMP/int5-b5-original-b4"
          python - <<'PY'
          import json,os,pathlib
          from mcfr.int5_af_tucked_slab_control import audit
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b5-original-b4"
          result=audit(folder)
          pinned=json.loads(pathlib.Path("project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json").read_text())
          assert result==pinned,"B4 original game/PNG/server/log baseline SHA mismatch"
          print("INT5_B5_ORIGINAL_EIGHT_NATIVE_F2_AND_16_SERVER_STATE_PAIRS_ANCHORED")
          PY
      - name: Build a fresh disposable official Fabric 1.21.1 creative world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b5-world" \
            --cache "$RUNNER_TEMP/int5-b5-cache"
      - name: Run Fabric with ONLY original AF123 source element4 removed in disposable JAR
        timeout-minutes: 26
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b5-af-element4-removal \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b5-world" \
              --work "$RUNNER_TEMP/int5-b5-client" \
              --output "$RUNNER_TEMP/int5-b5-element4-native-F2"
      - name: Audit all modified F2 PNG, exact source server states, no-change controls
        run: |
          python -m mcfr.int5_af_element4_removal_f2 \
            --baseline "$RUNNER_TEMP/int5-b5-original-b4" \
            --modified "$RUNNER_TEMP/int5-b5-element4-native-F2"
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b5-element4-native-F2"
          report=json.loads((out/"INT5_B5_AF123_ELEMENT4_NATIVE_F2_CAUSAL_AUDIT_V1.json").read_text())
          assert report["baseline_F2_verified"]==8
          assert report["disposable_model_F2_verified"]==8
          assert report["modified_session_server_chair_slab_state_checks"]==16
          assert report["provenance"]["modified_uncompressed_jar_member_count"]==1
          assert report["individual_original_element_pixel_ownership_approved"] is False
          assert report["final_INT5_part_meaning_approvals"]==0
          assert report["INT6_AI_training_or_redistribution_approvals"]==0
          print("INT5_B5_ACTUAL_SOURCE_ELEMENT4_INTERVENTION_DECISION",report["decision"])
          print("INT5_B5_EVIDENCE_BEGIN")
          print(json.dumps(report,sort_keys=True))
          print("INT5_B5_EVIDENCE_END")
          if report["decision"]!="PASS_BOUNDED_AF123_ELEMENT4_REMOVAL_RENDER_RESPONSE":
              raise SystemExit("Bounded actual F2 evidence CONDITIONAL. Inspect original artifact; never claim PASS.")
          PY
      - name: Store only real native F2, logs and audit; NEVER the temporary patched JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b5-element4-removal-original-versus-disposable-native-f2
          path: ${{ runner.temp }}/int5-b5-element4-native-F2/
          retention-days: 45
          if-no-files-found: warn
