name: INT-2 independent model geometry and state declarations
on:
  pull_request:
    paths:
      - 'scripts/integration/**'
      - 'tests/integration/**'
      - 'project/integration/**'
      - '.github/workflows/integration-int2-structure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG test dependency
        run: python -m pip install "Pillow>=10.0,<13.0"
      - name: Check independent arithmetic and source handling
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Recompute model hierarchy, geometry and declared UV for 2390 models
        run: python scripts/integration/audit_int2_structure.py --root . --out "$RUNNER_TEMP/int2-structure"
      - name: Publish static-audit source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2-model-structure-reaudit
          path: ${{ runner.temp }}/int2-structure/
          if-no-files-found: warn
          retention-days: 60
