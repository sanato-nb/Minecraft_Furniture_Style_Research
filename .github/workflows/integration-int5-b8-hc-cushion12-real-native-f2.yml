name: INT-5 B8 HC11210 actual black cushion element12 isolated removal native F2

on:
  push:
    branches: [work/int5-b8-hc11210-cushion-element12-f2-20261125]
    paths:
      - src/mcfr/int5_b8_hc_cushion_source_preflight.py
      - src/mcfr/int5_b8_hc_cushion_element12_native_f2.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_b8_hc_cushion_element12_native_f2.py
      - .github/workflows/integration-int5-b8-hc-cushion12-real-native-f2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-vs-disposable-two-game-sessions:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original Minecraft Fabric F2 runtime dependencies
        timeout-minutes: 10
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Eleven original HC element, parent, world, control and approval regression tests
        run: |
          python -m unittest discover -s tests/knowledge \
            -p test_int5_b8_hc_cushion_element12_native_f2.py -v
          python -m unittest discover -s tests/knowledge \
            -p test_chair_camera_command_recovery.py -v
      - name: Create pinned new real Minecraft Java 1.21.1 world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b8-original-world" \
            --cache "$RUNNER_TEMP/int5-b8-original-cache"
      - name: Actually run TWO independent Minecraft Fabric sessions, 16 original F2
        timeout-minutes: 43
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b8-hc-cushion12-native-f2 \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b8-original-world" \
              --work "$RUNNER_TEMP/int5-b8-client" \
              --output "$RUNNER_TEMP/int5-b8-native-two-sessions"
      - name: Independently open 16 native F2, prove server state, child-only patch, negative controls
        run: |
          python -m mcfr.int5_b8_hc_cushion_element12_native_f2 \
            --directory "$RUNNER_TEMP/int5-b8-native-two-sessions"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b8-native-two-sessions"/ \
            "INT5_B8_HC11210_CUSHION12_REAL_F2_CAUSAL_AUDIT_V1.json"
          a=json.loads(p.read_text(encoding="utf-8"))
          assert a["real_original_native_F2_verified"]==8
          assert a["real_modified_native_F2_verified"]==8
          assert a["real_exact_server_state_markers_verified"]==16
          assert a["original_official_JAR_sha1"]=="a9579fecd7ed429c282be21d5c921d220197acc6"
          assert a["original_model_provider_git_blob_sha1"]=="c5d9fbc054a897673f972fe2559376123751ba9b"
          assert a["single_child_member_modified_only"]==[
            "assets/handcrafted/models/block/warped_chair_black.json"]
          assert a["untouched_parent_and_white_child"] is True
          assert a["original_element_exclusive_visible_pixel_ownership_approved"] is False
          assert a["gameplay_seating_or_function_approved"] is False
          assert a["part_material_or_style_final_approved"] is False
          assert a["INT5_final_semantic_approvals"]==0
          assert a["INT6_AI_training_or_redistribution_rights_approved"]==0
          assert a["F70_unconditional_approvals"]==0
          print("INT5_B8_ACTUAL_DECISION",a["decision"])
          print("INT5_B8_ACTUAL_PIXELS",a["per_camera_pixel_response"])
          print("INT5_B8_AUDIT_BEGIN")
          print(json.dumps(a,ensure_ascii=True,sort_keys=True))
          print("INT5_B8_AUDIT_END")
          assert a["decision"]=="PASS_HC11210_BLACK_CHILD_ELEMENT12_REMOVAL_REAL_NATIVE_F2_RESPONSE", \
            "Conditional original image result must not be promoted to causal PASS"
          PY
      - name: Archive only actual F2 PNGs, logs, SHA metadata, never official or edited mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b8-hc-original-plus-one-child-patched-two-real-fabric-sessions
          path: ${{ runner.temp }}/int5-b8-native-two-sessions/
          retention-days: 45
          if-no-files-found: warn
