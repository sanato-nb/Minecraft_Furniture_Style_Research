name: INT-4-F6 소스 코드 조건 맞춘 의자 tucked·소파 inner_left 실제 Fabric F2

on:
  push:
    branches:
      - work/int4-f6-source-conditions-chair-couch-20261122
    paths:
      - src/mcfr/int4_nonchair_runtime.py
      - src/mcfr/int4_f6_source_causal_replay.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int4_f6_source_causal_replay.py
      - .github/workflows/integration-int4-f6-source-causal-replay.yml

permissions:
  contents: write

jobs:
  f6-source-causal-real-client:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Minecraft GL software renderer and PNG reader
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y \
              xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          fi

      - name: Original 1-5 source/model SHA and F6 causal/source pin tests plus F5/F4 regression
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_int4_f6_source_causal_replay.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_f5_state_diagnostic.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_f4_chair_bench_couch_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_f3_storage_shelf_light_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_f_missing_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_nonchair_runtime.py' -v

      - name: Download original pinned Handcrafted research source
        run: |
          curl -fLsS --retry 3 --max-time 90 \
            'https://codeload.github.com/terrarium-earth/Handcrafted/zip/8d21d1665916850c3fa3bdaf1370c50ec2ca7035' \
            -o "$RUNNER_TEMP/int4-f6-hc-source.zip"
          echo "MCFR_HC_SOURCE_ZIP=$RUNNER_TEMP/int4-f6-hc-source.zip" >> "$GITHUB_ENV"

      - name: Prepare disposable official Minecraft 1.21.1 Fabric world
        run: |
          echo "WORLD=$RUNNER_TEMP/int4-f6-world" >> "$GITHUB_ENV"
          echo "CACHE=$RUNNER_TEMP/int4-f6-cache" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/int4-f6-game-work" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/int4-f6-f2-evidence" >> "$GITHUB_ENV"
          python -m mcfr.chair_runtime_fixture world --version 1.21.1 \
            --path "$RUNNER_TEMP/int4-f6-world" --cache "$RUNNER_TEMP/int4-f6-cache"

      - name: Actual Fabric 1.21.1 chair front slab/table and couch rotated neighbor native F2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int4-f6-causal-replay --version 1.21.1 \
              --world "$WORLD" --work "$WORK" --output "$OUT"

      - name: Ten original-game source condition trials: exact state and native F2 SHA audit
        run: |
          python -m mcfr.int4_f6_source_causal_replay \
            --directory "$OUT" \
            --output project/integration/INT4_F6_TEN_SOURCE_CONDITION_GAME_CAPTURE_V1.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,os,json
          from PIL import Image
          p=Path('project/integration/INT4_F6_TEN_SOURCE_CONDITION_GAME_CAPTURE_V1.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j['status']=='PASS_REAL_CLIENT_TEN_SOURCE_CODE_CONDITION_TRIALS_NOT_FULL_F_EXIT'
          assert j['historical_case_ids']==['S02','S34']
          assert j['minecraft']=='1.21.1'
          assert j['counts']['native_client_stages']==10
          assert j['counts']['native_F2_images']==10
          assert len(j['cases'])==10
          assert j['counts']['int5_int6_new_approvals']==0
          assert j['pinned_upstream_source_provenance']['hc_modular_seat_git_blob']=='bbe428e318a7810f694ad2db640cf6d89b27aa5f'
          out=Path(os.environ['OUT'])
          for name,row in j['cases'].items():
              raw=(out/(name+'.png')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['native_F2_sha256']
              assert row['F2_original_dimensions']==[1024,684]
              with Image.open(out/(name+'.png')) as im:
                  im.load()
                  assert im.format=='PNG' and im.size==(1024,684)
              print('PASS ACTUAL FABRIC F6',name,row['server_exact_requested_state'],
                    row['actual_game_properties'],row['upstream_code_hypothesis_matches_game'])
          assert hashlib.sha256((out/'client.log').read_bytes()).hexdigest()==j['game_client_log_sha256']
          print('PASS F6',j['counts']['real_game_exact_historical_state_stages'],
                'exact historical server state trial(s) of 10')
          PY
          git diff --check

      - name: Save native diagnostic F2/screenshots/game log as temporary GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-f6-causal-chair-tuck-inner-couch-real-game-F2
          path: ${{ env.OUT }}/
          retention-days: 45
          if-no-files-found: warn

      - name: Commit actual diagnostic state metadata on Draft branch only
        if: success() && github.ref == 'refs/heads/work/int4-f6-source-conditions-chair-couch-20261122'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/integration/INT4_F6_TEN_SOURCE_CONDITION_GAME_CAPTURE_V1.json
          if git diff --cached --quiet; then
            echo "New source evidence unchanged"
          else
            git commit -m "INT-4-F6 실게임 소스 분기 의자 tucked/소파 inner_left 10회 F2 증거 블록상태와 원본 F2 SHA 기록"
            git push origin HEAD:refs/heads/work/int4-f6-source-conditions-chair-couch-20261122
          fi
