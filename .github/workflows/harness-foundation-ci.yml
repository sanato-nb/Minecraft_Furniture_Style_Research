name: Harness foundation and H0 source audit
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'harness/**'
      - 'inbox/**'
      - 'src/mcfr/**'
      - 'tests/harness/**'
      - 'scripts/migration/**'
      - 'project/**'
      - '.github/workflows/harness-foundation-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture verification dependency
        run: python -m pip install "Pillow>=10.0"
      - name: Check research profiles and read-only plan
        env:
          PYTHONPATH: src
        run: |
          python -m mcfr.foundation validate
          python -m unittest discover -s tests/harness -p 'test_*.py' -v
      - name: Verify baseline preservation, rehash files and scan code references
        run: |
          python scripts/migration/audit_repository.py \
            --baseline c87fa83846be513f797292bc9f31d2e01b4f3187 \
            --out "$RUNNER_TEMP/h0-reports"
      - name: Verify catalog evidence and replay the three H1 audits
        env:
          PYTHONPATH: src
        run: |
          catalog="$RUNNER_TEMP/h1-research.sqlite"
          python -m mcfr.research_db --db "$catalog" init
          python -m mcfr.research_db --db "$catalog" import-legacy
          python -m mcfr.foundation replay-history --db "$catalog" > "$RUNNER_TEMP/h0-reports/H1_REPLAY.json"
      - name: Upload H0 and H1 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0-h1-foundation-evidence
          path: ${{ runner.temp }}/h0-reports/
          if-no-files-found: warn
          retention-days: 30
