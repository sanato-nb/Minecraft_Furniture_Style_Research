name: INT-5 B15 AF123 six independently verified source elements real Fabric F2 batch

on:
  push:
    branches:
      - work/int5-b15-af123-six-original-elements-batch-f2-20261125
    paths:
      - src/mcfr/int5_b15_af123_six_element_batch_f2.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_b15_af123_six_element_batch_f2.py
      - .github/workflows/integration-int5-b15-af123-six-element-batch-f2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  six-independent-original-element-interventions:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source_index: [0, 1, 2, 3, 5, 6]
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated official Fabric and pixel-decoding dependencies
        timeout-minutes: 8
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Verify all 6 AF123 original source indices plus fail-closed source controls
        run: |
          python -m unittest discover -s tests/knowledge -p test_int5_b15_af123_six_element_batch_f2.py -v
          python -m unittest discover -s tests/knowledge -p test_int5_af_tucked_slab_control.py -v
      - name: Reopen exact B4 original native 8 F2 and SHA pin whole ZIP and anchored B4 audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' \
            'repos/sanato-nb/Minecraft_Furniture_Style_Research/actions/artifacts/14982648778/zip' \
            > "$RUNNER_TEMP/int5-b14-original-b4.zip"
          python - <<'PY'
          import hashlib,os,pathlib,zipfile,json
          from mcfr.int5_af_tucked_slab_control import audit
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b14-original-b4.zip"
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="4a50c784ecc7499546e5f4a23ef2b8de08a0d6fd8899cafc7b885a071d575e35"
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b14-original-b4"
          target.mkdir()
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert z.testzip() is None and len(names)==len(set(names))
              assert all(n and "/" not in n and "\\" not in n and n not in (".","..") for n in names)
              assert len(names)==11
              z.extractall(target)
          result=audit(target)
          pinned=json.loads(pathlib.Path("project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json").read_text())
          assert result==pinned and result["original_native_F2_verified"]==8
          assert result["exact_server_chair_state_and_slab_pair_checks"]==16
          print("INT5_B14_EXACT_B4_PINNED_8_NATIVE_F2_AND_16_CHAIR_SLAB_SERVER_PAIRS_PASS")
          PY
      - name: Build a fresh disposable official Fabric 1.21.1 creative world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b14-world" \
            --cache "$RUNNER_TEMP/int5-b14-cache"
      - name: Run real Fabric with ONLY selected original AF123 source element removed
        timeout-minutes: 26
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b15-af123-batch-f2 \
              --index "${{ matrix.source_index }}" \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b14-world" \
              --work "$RUNNER_TEMP/int5-b14-client" \
              --output "$RUNNER_TEMP/int5-b15-element${{ matrix.source_index }}-native-F2"
      - name: Audit selected original element, genuine F2, state and negative controls
        run: |
          python -m mcfr.int5_b15_af123_six_element_batch_f2 \
            --index "${{ matrix.source_index }}" \
            --baseline "$RUNNER_TEMP/int5-b14-original-b4" \
            --modified "$RUNNER_TEMP/int5-b15-element${{ matrix.source_index }}-native-F2"
          python - <<'PY'
          import json,os,pathlib
          index=int(os.environ["BATCH_SOURCE_INDEX"])
          directory=pathlib.Path(os.environ["RUNNER_TEMP"])/("int5-b15-element"+str(index)+"-native-F2")
          audit=json.loads((directory/"INT5_B15_ELEMENT_NATIVE_F2_AUDIT_V1.json").read_text())
          assert audit["source_key"]=="AF123/AF1394/"+str(index)
          assert audit["provenance"]["original_element_index"]==index
          assert audit["provenance"]["only_one_original_uncompressed_member_changed"] is True
          assert audit["provenance"]["shared_parent_and_other_resources_byte_identical"] is True
          assert audit["original_real_F2_count"]==8 and audit["modified_real_F2_count"]==8
          assert audit["modified_exact_chair_and_support_state_checks"]==16
          assert audit["unique_original_face_UV_to_GPU_pixel_approval"] is False
          assert audit["part_function_material_style_approval"] is False
          assert audit["AI_training_or_redistribution_rights_approval"] is False
          assert audit["decision"] != "CONDITIONAL_FAILED_OR_DRIFTED_SCREEN_CONTROLS"
          print("INT5_B15_VERIFIED_INDEPENDENT_ELEMENT",index,audit["decision"])
          for view,metrics in audit["per_view"].items():
              print("INT5_B15_F2_PIXELS",index,view,metrics["intervention_before_pixels"])
          PY
        env:
          BATCH_SOURCE_INDEX: ${{ matrix.source_index }}
      - name: Store only real native F2, logs and audit; NEVER the temporary patched JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b15-element${{ matrix.source_index }}-source-removal-native-f2
          path: ${{ runner.temp }}/int5-b14-element9-native-F2/
          retention-days: 45
          if-no-files-found: warn
