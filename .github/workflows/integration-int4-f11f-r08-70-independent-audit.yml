name: INT-4-F11F original two native F2 independent audit and 70 conditional ledger

on:
  push:
    branches:
      - work/int4-f11f-r08-af-fabric-source-build-pair-20261123
    paths:
      - scripts/integration/build_int4_f11f_r08_two_original_f2_audit.py
      - tests/integration/test_int4_f11f_r08_two_original_f2_audit.py
      - .github/workflows/integration-int4-f11f-r08-70-independent-audit.yml

permissions:
  actions: read
  contents: write

jobs:
  independent-R08-source-and-original-two-F2:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out frozen historical F11E 70-target source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original F2 PNG decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate source SHA and unchanged 69 old target records
        run: |
          python -m unittest discover -s tests/integration \
            -p 'test_int4_f11f_r08_two_original_f2_audit.py' -v
      - name: Download pinned two real-game F2 and independently rebuild 70-target conditional ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/integration/build_int4_f11f_r08_two_original_f2_audit.py \
            --zip-dir "$RUNNER_TEMP/int4-f11f-original-evidence"
      - name: Re-run exact same archive and require deterministic ledger bytes
        run: |
          python scripts/integration/build_int4_f11f_r08_two_original_f2_audit.py \
            --zip-dir "$RUNNER_TEMP/int4-f11f-original-evidence" --verify
      - name: Verify only R08 changed and no full F G H or INT5 INT6 claims
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path("project/integration")
          j=json.loads((root/"INT4_F11F_R08_TWO_FABRIC_ORIGINAL_F2_INDEPENDENT_AUDIT_V1.json").read_text(encoding="utf-8"))
          assert j["status"]=="PASS_70_CONDITIONAL_ZERO_HOLD_ZERO_FINAL_F_WITH_NEOFORGE_403_EXCEPTION"
          c=j["counts"]
          assert c["F_targets"]==70
          assert (c["F_conditional_before"],c["F_conditional_after"])==(69,70)
          assert (c["F_HOLD_before"],c["F_HOLD_after"])==(1,0)
          assert c["F_unconditional_final_approvals"]==0
          assert c["G_approvals"]==0 and c["H_exit_approvals"]==0
          assert c["INT5_semantics_approved"]==0 and c["INT6_training_or_redistribution_rights_approved"]==0
          assert j["official_4_0_3_NeoForge_not_tested"] is True
          with (root/"INT4_F11F_70_TARGET_EVIDENCE_DISPOSITIONS_V15.csv").open(encoding="utf-8",newline="") as f:
            allrows=list(csv.DictReader(f))
          assert len(allrows)==70
          assert all(row["final_disposition"].startswith("CONDITIONAL") for row in allrows)
          assert all(row["runtime_evidence_accepted_as_full_F_PASS"]=="false" for row in allrows)
          r08=next(x for x in allrows if x["target_id"]=="R08")
          assert "GIT403_FABRIC_STUDY" in r08["final_disposition"]
          assert "공식 4.0.3 NeoForge" in r08["additional_required_before_full_acceptance"]
          with (root/"INT4_F11F_0_PENDING_EXACT_F2_TARGETS_V1.csv").open(encoding="utf-8",newline="") as f:
            pending=list(csv.DictReader(f))
          assert len(pending)==0
          for name,key in (
              ("INT4_F11F_70_TARGET_EVIDENCE_DISPOSITIONS_V15.csv","ledger"),
              ("INT4_F11F_0_PENDING_EXACT_F2_TARGETS_V1.csv","pending"),
          ):
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==j["output_sha256"][key]
          print("PASS F11F R08: 70 conditional evidence, 0 remaining F evidence HOLD, 0 full approval")
          PY
          git diff --check
      - name: Retain only metadata audit outputs, never copyrighted original JAR or PNG in Git
        uses: actions/upload-artifact@v4
        with:
          name: int4-f11f-r08-70-conditional-zero-hold-original-F2-independent
          retention-days: 45
          path: |
            project/integration/INT4_F11F_70_TARGET_EVIDENCE_DISPOSITIONS_V15.csv
            project/integration/INT4_F11F_0_PENDING_EXACT_F2_TARGETS_V1.csv
            project/integration/INT4_F11F_R08_TWO_FABRIC_ORIGINAL_F2_INDEPENDENT_AUDIT_V1.json
            project/integration/INT4_F11F_R08_DIRECT_VISUAL_SOURCE_REVIEW_V1.md
      - name: Commit original source/audit metadata only to F11F Draft PR, never main
        if: github.ref == 'refs/heads/work/int4-f11f-r08-af-fabric-source-build-pair-20261123'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/integration/INT4_F11F_70_TARGET_EVIDENCE_DISPOSITIONS_V15.csv \
                  project/integration/INT4_F11F_0_PENDING_EXACT_F2_TARGETS_V1.csv \
                  project/integration/INT4_F11F_R08_TWO_FABRIC_ORIGINAL_F2_INDEPENDENT_AUDIT_V1.json \
                  project/integration/INT4_F11F_R08_DIRECT_VISUAL_SOURCE_REVIEW_V1.md
          if git diff --cached --quiet; then
            echo "Independent result unchanged"
          else
            git commit -m "INT-4-F11F R08 동일 원본 의자 두 실게임 F2 독립 감사, 조건부70/70·보류0"
            git push origin HEAD:refs/heads/work/int4-f11f-r08-af-fabric-source-build-pair-20261123
          fi
