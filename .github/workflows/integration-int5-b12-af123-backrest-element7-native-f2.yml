name: INT-5 B12 AF123 backrest element7 isolated child real F2 official slab-supported

on:
  push:
    branches:
      - work/int5-b12-af123-backrest-element7-native-f2-20261125
    paths:
      - src/mcfr/int5_b12_af123_backrest_element7_native_f2.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_b12_af123_backrest_element7_native_f2.py
      - .github/workflows/integration-int5-b12-af123-backrest-element7-native-f2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-fabric-single-source-element-intervention:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated official Fabric and pixel-decoding dependencies
        timeout-minutes: 8
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Verify source element7 and nine bounded negative-control tests
        run: |
          python -m unittest discover -s tests/knowledge -p test_int5_af_element7_removal_f2.py -v
          python -m unittest discover -s tests/knowledge -p test_int5_af_tucked_slab_control.py -v
      - name: Reopen exact B4 original native 8 F2 and SHA pin whole ZIP and anchored B4 audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' \
            'repos/sanato-nb/Minecraft_Furniture_Style_Research/actions/artifacts/14982648778/zip' \
            > "$RUNNER_TEMP/int5-b12-original-b4.zip"
          python - <<'PY'
          import hashlib,os,pathlib,zipfile,json
          from mcfr.int5_af_tucked_slab_control import audit
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b12-original-b4.zip"
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="4a50c784ecc7499546e5f4a23ef2b8de08a0d6fd8899cafc7b885a071d575e35"
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b12-original-b4"
          target.mkdir()
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert z.testzip() is None and len(names)==len(set(names))
              assert all(n and "/" not in n and "\\" not in n and n not in (".","..") for n in names)
              assert len(names)==11
              z.extractall(target)
          result=audit(target)
          pinned=json.loads(pathlib.Path("project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json").read_text())
          assert result==pinned and result["original_native_F2_verified"]==8
          assert result["exact_server_chair_state_and_slab_pair_checks"]==16
          print("INT5_B12_EXACT_B4_PINNED_8_NATIVE_F2_AND_16_CHAIR_SLAB_SERVER_PAIRS_PASS")
          PY
      - name: Build a fresh disposable official Fabric 1.21.1 creative world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b12-world" \
            --cache "$RUNNER_TEMP/int5-b12-cache"
      - name: Run Fabric with ONLY original AF123 source element7 removed in disposable JAR
        timeout-minutes: 26
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b12-af123-backrest7-native-f2 \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b12-world" \
              --work "$RUNNER_TEMP/int5-b12-client" \
              --output "$RUNNER_TEMP/int5-b12-element7-native-F2"
      - name: Audit all modified F2 PNG, exact source server states, no-change controls
        run: |
          python -m mcfr.int5_b12_af123_backrest_element7_native_f2 \
            --baseline "$RUNNER_TEMP/int5-b12-original-b4" \
            --modified "$RUNNER_TEMP/int5-b12-element7-native-F2"
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"int5-b12-element7-native-F2"
          report=json.loads((out/"INT5_B12_AF123_ELEMENT7_NATIVE_F2_CAUSAL_AUDIT_V1.json").read_text())
          assert report["baseline_F2_verified"]==8
          assert report["disposable_model_F2_verified"]==8
          assert report["modified_session_server_chair_slab_state_checks"]==16
          assert report["provenance"]["modified_uncompressed_jar_member_count"]==1
          assert report["source_element_index"]==7
          assert report["original_source_part_key"]=="AF123/AF1394/7"
          assert report["source_role_hypothesis_not_function"]=="BACKREST_ASSEMBLY"
          assert report["provenance"]["original_element_index"]==7
          assert report["provenance"]["original_released_face_count"]==46
          assert report["provenance"]["disposable_child_face_count"]==44
          assert len(report["provenance"]["original_element_faces"])==2
          assert report["provenance"]["modified_member_is_only_target_child_json"] is True
          assert report["provenance"]["original_shared_provider_unmodified"] is True
          assert report["provenance"]["all_other_uncompressed_members_byte_identical"] is True
          assert report["provenance"]["selected_original_blockstate"]=="another_furniture:acacia_chair[facing=north,tucked=true,variant=10]"
          assert report["unmodified_controls_equal"] is True
          assert report["no_change_outside_original_chair_foreground"] is True
          assert report["individual_original_element_pixel_ownership_approved"] is False
          assert report["final_INT5_part_meaning_approvals"]==0
          assert report["INT6_AI_training_or_redistribution_approvals"]==0
          print("INT5_B12_ACTUAL_SOURCE_ELEMENT7_INTERVENTION_DECISION",report["decision"])
          print("INT5_B12_EVIDENCE_BEGIN")
          print(json.dumps(report,sort_keys=True))
          print("INT5_B12_EVIDENCE_END")
          if report["decision"]!="PASS_BOUNDED_AF123_ELEMENT7_REMOVAL_RENDER_RESPONSE":
              raise SystemExit("Bounded actual F2 evidence CONDITIONAL. Inspect original artifact; never claim PASS.")
          PY
      - name: Store only real native F2, logs and audit; NEVER the temporary patched JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b12-element7-removal-original-versus-disposable-native-f2
          path: ${{ runner.temp }}/int5-b12-element7-native-F2/
          retention-days: 45
          if-no-files-found: warn
