name: 1-3-D engine state and collision audit

on:
  push:
    paths:
      - '.github/workflows/1-3-d-runtime.yml'
      - 'research/furniture_mods/phase_1-3/runtime_actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.11']
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install software display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1 libglfw3
      - name: Read states and collision boxes from the official client
        run: |
          python3 research/furniture_mods/phase_1-3/runtime_actions/run_probe.py \
            --version "${{ matrix.minecraft }}" --work "$RUNNER_TEMP/mc" --output results
      - name: Summarize engine results
        if: always()
        run: |
          if [ -f results/SUMMARY.json ]; then
            {
              echo '### 1-3-D engine audit'
              echo 'Collision context: empty neighborhood and default shape context.'
              echo '```json'
              cat results/SUMMARY.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1-3-d-runtime-${{ matrix.minecraft }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
