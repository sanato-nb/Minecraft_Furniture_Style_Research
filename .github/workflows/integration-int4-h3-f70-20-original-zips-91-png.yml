name: INT-4-H3 reopen all 20 original F70 Actions archives and 91 native F2 PNGs

on:
  push:
    branches:
      - work/int4-h3-f70-original-20-archives-91-png-audit-20261123
    paths:
      - scripts/integration/build_int4_h3_f70_original_20_zip_91_png_audit.py
      - tests/integration/test_int4_h3_f70_original_20_zip_91_png_audit.py
      - .github/workflows/integration-int4-h3-f70-20-original-zips-91-png.yml

permissions:
  actions: read
  contents: write

jobs:
  f70-original-artifact-zip-and-png-sha-reopen:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Read pinned historical F70 ledger without modifying original studies
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only original PNG format decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check F70 source map 20 archives and R02 R05 R06 R07 R08 filename counts
        run: |
          python -m unittest discover -s tests/integration \
            -p 'test_int4_h3_f70_original_20_zip_91_png_audit.py' -v
      - name: Download all 20 Actions original ZIPs and SHA check all 91 PNG evidence images
        run: |
          python scripts/integration/build_int4_h3_f70_original_20_zip_91_png_audit.py \
            --cache "$RUNNER_TEMP/int4-h3-original-f70-artifacts"
      - name: Reopen local original ZIPs and require deterministic original SHA audit
        run: |
          python scripts/integration/build_int4_h3_f70_original_20_zip_91_png_audit.py \
            --cache "$RUNNER_TEMP/int4-h3-original-f70-artifacts" --verify
      - name: Check every image and archive audited without ever claiming full F or rights
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path('project/integration')
          j=json.loads((p/'INT4_H3_ALL_F70_ORIGINAL_ARTIFACT_REOPEN_AUDIT_V1.json').read_text(encoding='utf-8'))
          assert j['status']=='PASS_ALL_F70_ORIGINAL_PNG_ARCHIVE_SHA_AND_CRC_NO_FULL_F_CONTRACT'
          assert j['fixed_case_count']==70
          assert j['historical_1_5_cases']==62 and j['risk_scenarios']==8
          assert j['recorded_original_PNG_occurrences']==91
          assert j['original_distinct_actions_archive_downloaded']==20
          assert j['original_distinct_actions_runs']==19
          assert j['original_actions_artifacts_expired']==0
          assert j['all_20_archive_expected_zip_sha256_verified'] is True
          assert j['all_20_archive_CRC_checked'] is True
          assert j['all_91_native_F2_PNG_sha256_verified'] is True
          assert j['all_91_PNG_decoded'] is True
          assert j['native_F2_new_visual_human_per_case_review_performed'] is False
          assert j['every_original_case_server_state_log_reopened_and_reapproved'] is False
          for key in ('F_unconditional_full_exit_approved','G_unconditional_exit_approved',
                      'H_full_exit_approved','INT5_semantics_approved',
                      'INT6_artist_training_or_redistribution_rights_approved'):
            assert j[key]==0,key
          for name,key,count in [
            ('INT4_H3_20_ORIGINAL_ARTIFACT_ZIP_SHA_AUDIT_V1.csv','artifact20_sha256',20),
            ('INT4_H3_91_NATIVE_F2_ORIGINAL_PNG_SHA_AUDIT_V1.csv','png91_sha256',91),
            ('INT4_H3_70_CASE_ORIGINAL_F2_REOPEN_V1.csv','target70_sha256',70),
          ]:
            data=(p/name).read_bytes()
            assert hashlib.sha256(data).hexdigest()==j['outputs'][key]
            with (p/name).open(encoding='utf-8',newline='') as f:
              assert len(list(csv.DictReader(f)))==count
          print('PASS H3 20 genuine original SHA/CRC ZIPs, 91 original PNG SHA+decode, 70 target links')
          PY
          git diff --check
      - name: Archive only derived original evidence SHA and metadata never PNG or source JAR
        uses: actions/upload-artifact@v4
        with:
          name: int4-h3-original-f70-all-20-zip-91-png-sha-reopen
          retention-days: 45
          path: |
            project/integration/INT4_H3_20_ORIGINAL_ARTIFACT_ZIP_SHA_AUDIT_V1.csv
            project/integration/INT4_H3_91_NATIVE_F2_ORIGINAL_PNG_SHA_AUDIT_V1.csv
            project/integration/INT4_H3_70_CASE_ORIGINAL_F2_REOPEN_V1.csv
            project/integration/INT4_H3_ALL_F70_ORIGINAL_ARTIFACT_REOPEN_AUDIT_V1.json
            project/integration/INT4_H3_F70_20_ARCHIVES_91_PNG_REOPEN_REPORT_V1.md
      - name: Commit metadata with source SHA only to H3 Draft, not main
        if: success() && github.ref == 'refs/heads/work/int4-h3-f70-original-20-archives-91-png-audit-20261123'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/integration/INT4_H3_20_ORIGINAL_ARTIFACT_ZIP_SHA_AUDIT_V1.csv \
                  project/integration/INT4_H3_91_NATIVE_F2_ORIGINAL_PNG_SHA_AUDIT_V1.csv \
                  project/integration/INT4_H3_70_CASE_ORIGINAL_F2_REOPEN_V1.csv \
                  project/integration/INT4_H3_ALL_F70_ORIGINAL_ARTIFACT_REOPEN_AUDIT_V1.json \
                  project/integration/INT4_H3_F70_20_ARCHIVES_91_PNG_REOPEN_REPORT_V1.md
          if git diff --cached --quiet; then echo "Original audit metadata unchanged"; else
            git commit -m "INT-4-H3 F70 원본 ZIP20·실제 F2 PNG91 해시와 디코딩 전수 재검수"
            git push origin HEAD:refs/heads/work/int4-h3-f70-original-20-archives-91-png-audit-20261123
          fi
