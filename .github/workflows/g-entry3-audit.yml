name: G Entry3 source cross-stage audit
# Recheck: unconditional multipart when omitted and historical D {} are equivalent.
on:
  push:
    paths:
      - '.github/workflows/g-entry3-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pixel decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Reopen 945 original files and independently audit source
        id: evidence
        continue-on-error: true
        run: python scripts/phase_1_2_g_entry3_audit.py
      - name: Upload evidence even if independent gate failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G-Entry3-945-original-source-evidence
          path: |
            research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_*.csv
            research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_*.json
            research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_REPORT.md
          retention-days: 30
      - name: Commit source evidence without touching A-F or v69
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_SOURCE_IDENTITY_945.csv
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_MODEL_GEOMETRY_RECOUNT.csv
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_D_ORIGINAL_OPTIONS.csv
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_PNG_BINARY_AUDIT.csv
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_ORIGINAL_FACES_*.csv
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_INDEPENDENT_RECOUNT.json
          git add research/vanilla_models/phase_1-2-G/entry3/G_ENTRY3_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "1-2-G Entry3: 원본 945개 전체 독립 검증 근거 저장"
            git push origin HEAD:main
          fi
      - name: Fail closed if source audit had errors
        if: steps.evidence.outcome != 'success'
        run: exit 1
