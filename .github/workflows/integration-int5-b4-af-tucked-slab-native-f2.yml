name: INT-5 B4 AF tucked valid support slab two-camera native F2 A-B-A-air

on:
  push:
    branches:
      - work/int5-b4-af-tucked-slab-control-20261125
    paths:
      - src/mcfr/int5_af_tucked_slab_control.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_af_tucked_slab_control.py
      - project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json
      - project/integration/INT5_B4_RESEARCH_REPORT_V1.md
      - .github/workflows/integration-int5-b4-af-tucked-slab-native-f2.yml
  pull_request:
    paths:
      - src/mcfr/int5_af_tucked_slab_control.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int5_af_tucked_slab_control.py
      - project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json
      - project/integration/INT5_B4_RESEARCH_REPORT_V1.md
      - .github/workflows/integration-int5-b4-af-tucked-slab-native-f2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-fabric-tucked-chair-and-support-pixel-differencing:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified official client F2 and image decoding dependencies
        timeout-minutes: 9
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Seven valid source fixture and negative pixel control unit tests
        run: |
          python -m unittest discover -s tests/knowledge -p test_int5_af_tucked_slab_control.py -v
          python -m unittest discover -s tests/knowledge -p test_chair_camera_command_recovery.py -v
      - name: Create disposable official Java 1.21.1 creative flat world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/int5-b4-world" \
            --cache "$RUNNER_TEMP/int5-b4-cache"
      - name: Actually run official AF 4.0.2 Fabric and capture eight valid-source native F2
        timeout-minutes: 24
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int5-b4-af-tucked-slab \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/int5-b4-world" \
              --work "$RUNNER_TEMP/int5-b4-client" \
              --output "$RUNNER_TEMP/int5-b4-native-F2"
      - name: Independently re-open 8 screenshot PNG and exact server chair AND slab states
        run: |
          python -m mcfr.int5_af_tucked_slab_control \
            --directory "$RUNNER_TEMP/int5-b4-native-F2"
          cp "$RUNNER_TEMP/int5-b4-native-F2/INT5_B4_AF_TUCKED_SLAB_INDEPENDENT_AUDIT_V1.json" \
            "$RUNNER_TEMP/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json"
          python - <<'PY'
          import json,os,pathlib
          src=pathlib.Path(os.environ["RUNNER_TEMP"])/"INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json"
          d=json.loads(src.read_text(encoding="utf-8"))
          assert d["original_native_F2_verified"]==8
          assert d["exact_server_chair_state_and_slab_pair_checks"]==16
          assert d["actual_game_sessions"]==1
          assert d["tucked_true_without_support_was_tested"] is False
          assert d["new_individual_element_F2_pixel_identifications"]==0
          assert d["new_element_function_approvals"]==0
          assert d["INT6_training_redistribution_approvals"]==0
          assert set(d["per_camera_original_screen_pixel_differences"])=={"south","north"}
          print("INT5_B4_ACTUAL_VALID_TUCKED_F2_8_SERVER_PAIR_16_PASS")
          print("INT5_B4_INDEPENDENT_RESULT_JSON_BEGIN")
          print(json.dumps(d,ensure_ascii=True,sort_keys=True))
          print("INT5_B4_INDEPENDENT_RESULT_JSON_END")
          PY
      - name: Check committed audit JSON if present and never promote function approval
        run: |
          if [ -f project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json ]; then
            python - <<'PY'
          import json,os,pathlib
          expected=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json").read_text())
          committed=json.loads(pathlib.Path("project/integration/INT5_B4_AF_TUCKED_SLAB_REAL_F2_AUDIT_V1.json").read_text())
          assert expected==committed,"Original F2 independent audit cannot replay"
          PY
          else
            echo "FIRST_RUN_GITHUB_ARTIFACT_HAS_AUDIT_NO_FALSE_PASS"
          fi
      - name: Retain original game F2, actual console log and metadata in expiring artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int5-b4-original-fabric-tucked-slab-eight-native-f2
          path: ${{ runner.temp }}/int5-b4-native-F2/
          retention-days: 45
          if-no-files-found: warn
