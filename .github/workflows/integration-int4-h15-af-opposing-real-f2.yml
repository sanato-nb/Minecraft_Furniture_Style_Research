name: INT-4-H15 actual Fabric AF opposing-camera 8 F2 model-texture control

on:
  push:
    branches:
      - work/int4-h15-af-opposing-camera-native-f2-20261124
    paths:
      - src/mcfr/int4_h15_af_opposing_f2_capture.py
      - src/mcfr/runtime.py
      - tests/knowledge/test_int4_h15_af_opposing_f2_capture.py
      - .github/workflows/integration-int4-h15-af-opposing-real-f2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-fabric-AF-two-sided-F2:
    if: github.repository == 'sanato-nb/Minecraft_Furniture_Style_Research'
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      PYTHONPATH: src
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real native F2 and PNG decoding
        timeout-minutes: 9
        run: |
          python -m pip install 'Pillow>=10,<13' 'nbtlib>=2,<3'
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v xdotool >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb xauth xdotool
          fi
      - name: Regression test original two camera poses and H13 GUI acknowledgement
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_int4_h15_af_opposing_f2_capture.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_chair_camera_command_recovery.py' -v
          python -m unittest discover -s tests/knowledge -p 'test_int4_h12_af_chair_samepose_f2_capture.py' -v
      - name: Create official pinned singleplayer Fabric 1.21.1 source chair world
        run: |
          python -m mcfr.chair_runtime_fixture world \
            --version 1.21.1 \
            --path "$RUNNER_TEMP/h15-original-world" \
            --cache "$RUNNER_TEMP/h15-original-world-cache"
      - name: Actually run Minecraft Fabric client and take eight original F2 with two opposing cameras
        timeout-minutes: 24
        run: |
          xvfb-run -a -s '-screen 0 1024x684x24' \
            python -m mcfr.runtime int4-h15-af-opposing-f2 \
              --version 1.21.1 \
              --world "$RUNNER_TEMP/h15-original-world" \
              --work "$RUNNER_TEMP/h15-real-client" \
              --output "$RUNNER_TEMP/h15-native-f2"
      - name: Independently re-read all original F2 PNG SHA and exact Minecraft server states
        if: success()
        run: |
          python -m mcfr.int4_h15_af_opposing_f2_capture \
            --directory "$RUNNER_TEMP/h15-native-f2"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"h15-native-f2"
          doc=json.loads((root/"INT4_H15_AF_OPPOSING_VIEW_INDEPENDENT_RESULT_V1.json").read_text())
          assert doc["actual_game_runs"]==1
          assert doc["original_game_native_F2_verified"]==8
          assert doc["original_game_exact_server_states_verified"]==8
          assert doc["source_camera_face_candidates"]=={"south":"south","north":"north"}
          assert doc["same_original_source_block_facing_north"] is True
          assert doc["verified_GPU_face_texel_pixel_attribution"] is False
          assert doc["F70_unconditional_approvals"]==0
          assert doc["INT5_semantics_approved"]==0
          assert doc["INT6_training_or_redistribution_approved"]==0
          print("H15 original-source 8 F2 and 8 exact game states verified",doc["status"])
          print("H15 pixel contrasts (observed, not forced)",doc["per_view_original_RGB_ROI"])
          PY
          git diff --check
      - name: Preserve original F2/GUI log and derived SHA metadata in expiring artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-h15-original-real-fabric-af-north-south-eight-native-F2
          retention-days: 45
          if-no-files-found: warn
          path: ${{ runner.temp }}/h15-native-f2/
